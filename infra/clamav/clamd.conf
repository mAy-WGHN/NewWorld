# clamd for the medical certificates (AU) of Workforce. Used as /etc/clamav/clamd.conf of the image clamav/clamav (version as in the AppHost).
# The limits are pinned here and must stay at least as large as Workforce:Certificates:MaxFileBytes (default 10 MB): a file above a limit is
# refused by clamd, which Workforce counts as "not clean" (fail closed), so a limit that is too small rejects valid uploads.

# Workforce sends the file with INSTREAM over TCP. The connection is NOT encrypted: expose the port only inside the pod or a private network
# (never to the internet, never through a public load balancer). Service name for Workforce:Certificates:Scanner:Host.
TCPSocket 3310
TCPAddr 0.0.0.0

StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000

# Documents are scanned in memory; nothing is kept. Plan 1 to 2 GB of RAM for the signature database.
LogFile /dev/stdout
LogTime yes
Foreground yes
