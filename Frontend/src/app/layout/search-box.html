<mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full max-w-2xl">
  <mat-icon matPrefix class="mr-2 text-[24px] text-on-surface-variant">search</mat-icon>
  <input matInput type="search" aria-label="Suche" placeholder="Was möchtest du erledigen?" autocomplete="off"
         [value]="query()" (input)="onInput($event)" [matAutocomplete]="auto" />
  <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption [displayWith]="display" (optionSelected)="choose($event)">
    @for (item of results(); track item.path) {
      <mat-option [value]="item">
        <span class="block font-medium">{{ item.label }}</span>
        <span class="block text-xs text-on-surface-variant">{{ item.about }}</span>
      </mat-option>
    } @empty {
      @if (query().trim()) {
        <mat-option disabled>Dazu habe ich nichts gefunden.</mat-option>
      }
    }
  </mat-autocomplete>
  @if (examples(); as hint) {
    <mat-hint>{{ hint }}</mat-hint>
  }
</mat-form-field>
