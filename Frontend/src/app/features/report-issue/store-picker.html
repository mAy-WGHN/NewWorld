<mat-form-field appearance="outline" class="w-full" subscriptSizing="dynamic">
  <mat-label>Filiale</mat-label>
  <mat-chip-grid #grid aria-label="Gewählte Filialen">
    @for (s of selected(); track s.id) {
      <mat-chip-row data-testid="chosen" (removed)="remove(s)">
        {{ label(s) }}
        <button matChipRemove type="button" data-action="remove" [attr.data-id]="s.id" [attr.aria-label]="s.name + ' entfernen'">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
  </mat-chip-grid>
  <input [id]="inputId()" placeholder="Filiale suchen…" autocomplete="off" [attr.aria-invalid]="error() ? 'true' : null"
         [matChipInputFor]="grid" [matAutocomplete]="auto" [value]="query()" (input)="onInput($event)" />
  <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption [displayWith]="display" (optionSelected)="add($event)">
    @for (s of matches(); track s.id) {
      <mat-option [value]="s" data-testid="location-option" [attr.data-id]="s.id">{{ label(s) }}</mat-option>
    } @empty {
      <mat-option disabled>Keine Filiale gefunden.</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
@if (error(); as message) {
  <p class="m-0 mt-1 text-[13px] text-error" role="alert">{{ message }}</p>
}
