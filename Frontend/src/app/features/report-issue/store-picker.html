<div class="picker" [class.invalid]="error()">
  <label [for]="inputId()">Filiale</label>
  @if (selected().length) {
    <ul class="chosen">
      @for (s of selected(); track s.id) {
        <li class="chip" data-testid="chosen">
          {{ label(s) }}
          <button type="button" data-action="remove" [attr.data-id]="s.id" [attr.aria-label]="s.name + ' entfernen'" (click)="remove(s)">
            <app-icon name="x" [size]="14" />
          </button>
        </li>
      }
    </ul>
  }
  <input [id]="inputId()" type="text" role="combobox" autocomplete="off" placeholder="Filiale suchen…" aria-autocomplete="list"
         [attr.aria-expanded]="open()" [attr.aria-controls]="inputId() + '-list'" [attr.aria-invalid]="error() ? 'true' : null"
         [value]="query()" (input)="onInput($event)" (keydown)="onKey($event)" (focus)="open.set(true)" (click)="open.set(true)" (blur)="close()" />
  @if (open()) {
    <ul class="list" role="listbox" [id]="inputId() + '-list'">
      @for (s of matches(); track s.id; let i = $index) {
        <li role="option" [attr.aria-selected]="i === active()" [class.active]="i === active()">
          <button type="button" tabindex="-1" data-testid="location-option" [attr.data-id]="s.id" (mousedown)="$event.preventDefault()" (click)="add(s)">{{ label(s) }}</button>
        </li>
      } @empty {
        <li class="none">Keine Filiale gefunden.</li>
      }
    </ul>
  }
  @if (error(); as message) {
    <p class="field-error" role="alert">{{ message }}</p>
  }
</div>
