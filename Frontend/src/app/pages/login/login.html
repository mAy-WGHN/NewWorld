<main class="wrap">
  <form class="card" (submit)="submit($event)" novalidate>
    <h1>NewWorld</h1>
    <p class="hint">Melde dich mit deiner Personalnummer und deiner PIN an.</p>

    <label for="pn">Personalnummer</label>
    <input id="pn" name="username" type="text" inputmode="numeric" autocomplete="username" autofocus
           [value]="personnelNumber()" (input)="set('personnelNumber', $event)" [disabled]="busy()" />

    <label for="pin">PIN</label>
    <input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password"
           [value]="pin()" (input)="set('pin', $event)" [disabled]="busy()" />

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="btn" [disabled]="busy() || !personnelNumber().trim() || !pin()">
      {{ busy() ? 'Anmelden …' : 'Anmelden' }}
    </button>
  </form>
</main>
